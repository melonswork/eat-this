[tools]
java = "temurin-21"
"github:NationalSecurityAgency/ghidra" = { version = "Ghidra_12.1.4_build", version_prefix = "" }
"7zip" = "latest"
python = "3.13"
uv = "latest"
rust = "1.94"
cmake = "latest"

[tasks.extract]
description = "Unpack the data track of the original CD image into work/cd"
sources = ["iso/Eat This.img", "tools/extract_track1.py"]
outputs = ["work/track1.iso"]
run = """
mkdir -p work/cd
python -I tools/extract_track1.py "iso/Eat This.img" work/track1.iso 221285  # track 2 starts at 49:10:35
7zz x -y -owork/cd work/track1.iso > /dev/null
chmod -R u+rwX work/cd
"""

[tasks.ghidra]
description = "Open the Ghidra GUI"
run = '"$(mise where github:NationalSecurityAgency/ghidra)/ghidraRun"'

[tasks.analyze]
description = "Import and auto-analyze the game binaries into the Ghidra project in work/ghidra"
depends = ["extract"]
run = """
mkdir -p work/ghidra
"$(mise where github:NationalSecurityAgency/ghidra)/support/analyzeHeadless" work/ghidra EatThis \
  -import work/cd/ETLAUNCH.EXE work/cd/ET_DBG.EXE work/cd/MENU.EXE -overwrite
"""

[tasks.ghidra-natives]
description = "Build Ghidra's native decompiler/sleigh for this Mac (the release zip ships none for macOS)"
run = 'cd "$(mise where github:NationalSecurityAgency/ghidra)/support/gradle" && ./gradlew buildNatives'

[tasks.decomp]
description = "Dump the decompiled C of every analyzed binary into work/decomp"
run = """
"$(mise where github:NationalSecurityAgency/ghidra)/support/analyzeHeadless" work/ghidra EatThis \
  -process -noanalysis -readOnly -scriptPath tools/ghidra_scripts -postScript ExportC.java
"""

[tasks.render]
description = "Render a tile group, sprite group or map to PNG: mise run render -- map work/cd/BIN/MAPS/CITY01.MAP out.png"
run = "uv run python tools/render.py"

[tasks.names]
description = "Apply re/names.csv to ETLAUNCH.EXE in the Ghidra project, then re-export the C"
run = """
"$(mise where github:NationalSecurityAgency/ghidra)/support/analyzeHeadless" work/ghidra EatThis \
  -process ETLAUNCH.EXE -noanalysis -scriptPath tools/ghidra_scripts -postScript ApplyNames.java
mise run decomp
"""

[tasks.demos]
description = "Decode and validate every recorded demo on the CD, including the RandSeed oracle"
run = "uv run python tools/demo.py work/cd/BIN/USERMAPS/*.DMO/*.REC"

[tasks.port]
description = "Build and run the port: mise run port -- [--demo work/cd/BIN/USERMAPS/LEVEL1_2.DMO] [--map work/cd/BIN/MAPS/CITY01.MAP]"
dir = "port"
run = "cargo run --release --"

[tasks.check-demo]
description = "Play a recorded demo headless in the port and compare RandSeed with its CHECK entries"
dir = "port"
run = "cargo run --release -- --headless --demo"

[tasks.trace]
description = "Run the original game under an x86 emulator on a demo and log every Random call: mise run trace -- work/cd/BIN/USERMAPS/GRINDER.DMO"
run = "uv run python tools/tracer.py"

[env]
# SDL2 (built from source by the sdl2 crate) still declares cmake_minimum_required < 3.5
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[tasks.disasm]
description = "Disassemble functions: mise run disasm -- NAME... -> work/decomp/NAME.asm"
run = '"$(mise where github:NationalSecurityAgency/ghidra)/support/analyzeHeadless" work/ghidra EatThis -process ETLAUNCH.EXE -noanalysis -readOnly -scriptPath tools/ghidra_scripts -postScript Disasm.java'
